[package]
name = "syncfiles-server"
version = "0.1.0"
edition = "2021"
description = "SyncFiles V1 server - Actix-web REST API"

[dependencies]
actix-web = { version = "4", features = ["rustls"] }
actix-cors = "0.7"
actix-files = "0.6"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
dotenvy = "0.15"
sha2 = "0.10"
async-trait = "0.1"
base64 = "0.21"
hex = "0.4"
tempfile = "3"
syncfiles-models = { path = "../syncfiles-models" }

[build-dependencies]

[dev-dependencies]
actix-web = { version = "4", features = ["rustls", "macros"] }
actix-http = "3"
actix-rt = "2"
tempfile = "3"