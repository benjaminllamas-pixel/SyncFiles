[package]
name = "syncfiles-client"
version = "0.1.0"
edition = "2021"
description = "SyncFiles V1 client - basic test client"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

notify = "6.1"
sha2 = "0.10"
dirs = "5"
eframe = "0.29"
rfd = "0.15"
syncfiles-models = { path = "../syncfiles-models" }
base64 = "0.21"

[build-dependencies]

[dev-dependencies]
tempfile = "3"