name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android signing
        if: ${{ secrets.SF_ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          SF_ANDROID_KEYSTORE_BASE64: ${{ secrets.SF_ANDROID_KEYSTORE_BASE64 }}
          SF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SF_ANDROID_KEYSTORE_PASSWORD }}
          SF_ANDROID_KEYSTORE_ALIAS: ${{ secrets.SF_ANDROID_KEYSTORE_ALIAS }}
          SF_ANDROID_KEY_PASSWORD: ${{ secrets.SF_ANDROID_KEY_PASSWORD }}
        run: |
          python3 -c 'import base64, pathlib, sys; pathlib.Path("/tmp/syncfiles-release.keystore").write_bytes(base64.b64decode(sys.stdin.read()))' <<< "$SF_ANDROID_KEYSTORE_BASE64"
          {
            printf 'SF_KEYSTORE_FILE=/tmp/syncfiles-release.keystore\n'
            printf 'SF_KEYSTORE_PASSWORD=%s\n' "$SF_ANDROID_KEYSTORE_PASSWORD"
            printf 'SF_KEYSTORE_ALIAS=%s\n' "$SF_ANDROID_KEYSTORE_ALIAS"
            printf 'SF_KEY_PASSWORD=%s\n' "$SF_ANDROID_KEY_PASSWORD"
          } >> syncfiles-android/gradle.properties

      - name: Install Windows installer tool
        if: ${{ matrix.platform == 'windows-x86_64' }}
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build release binaries
        run: |
          cargo build --release --manifest-path syncfiles-server/Cargo.toml
          cargo build --release --manifest-path syncfiles-client/Cargo.toml
          cargo build --release --manifest-path syncfiles-cli/Cargo.toml

      - name: Build Android release
        run: |
          cd syncfiles-android
          ./gradlew assembleRelease --no-daemon

      - name: Require signing secrets for tag releases
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          SF_GPG_PRIVATE_KEY: ${{ secrets.SF_GPG_PRIVATE_KEY }}
          SF_APPLE_CERT_BASE64: ${{ secrets.SF_APPLE_CERT_BASE64 }}
          SF_WINDOWS_PFX_BASE64: ${{ secrets.SF_WINDOWS_PFX_BASE64 }}
          SF_ANDROID_KEYSTORE_BASE64: ${{ secrets.SF_ANDROID_KEYSTORE_BASE64 }}
        run: |
          case "${{ matrix.platform }}" in
            linux-*) test -n "$SF_GPG_PRIVATE_KEY" ;;
            macos-*) test -n "$SF_APPLE_CERT_BASE64" ;;
            windows-*) test -n "$SF_WINDOWS_PFX_BASE64" ;;
          esac
          test -n "$SF_ANDROID_KEYSTORE_BASE64"

      - name: Package artifacts
        env:
          SF_VERSION: ${{ github.ref_name }}
        run: scripts/package-release.sh ${{ matrix.platform }} dist

      - name: Sign and verify packages
        shell: bash
        env:
          SF_GPG_PRIVATE_KEY: ${{ secrets.SF_GPG_PRIVATE_KEY }}
          SF_GPG_PASSPHRASE: ${{ secrets.SF_GPG_PASSPHRASE }}
          SF_APPLE_CERT_BASE64: ${{ secrets.SF_APPLE_CERT_BASE64 }}
          SF_APPLE_CERT_PASSWORD: ${{ secrets.SF_APPLE_CERT_PASSWORD }}
          SF_APPLE_IDENTITY: ${{ secrets.SF_APPLE_IDENTITY }}
          SF_WINDOWS_PFX_BASE64: ${{ secrets.SF_WINDOWS_PFX_BASE64 }}
          SF_WINDOWS_CERT_PASSWORD: ${{ secrets.SF_WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-release.sh dist ${{ matrix.platform }}

      - name: Notarize macOS release
        if: ${{ matrix.platform == 'macos-arm64' }}
        shell: bash
        env:
          SF_APPLE_ID: ${{ secrets.SF_APPLE_ID }}
          SF_APPLE_APP_PASSWORD: ${{ secrets.SF_APPLE_APP_PASSWORD }}
          SF_APPLE_TEAM_ID: ${{ secrets.SF_APPLE_TEAM_ID }}
        run: scripts/notarize-release.sh dist

      - name: Verify release artifacts
        shell: bash
        run: scripts/verify-release.sh dist ${{ matrix.platform }}

      - name: Upload release diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics-${{ matrix.platform }}
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
